<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sin conexión — GEME</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #e2e8f0; }
        main { text-align: center; padding: 2rem; max-width: 420px; }
        h1 { font-size: 1.5rem; margin: 1rem 0 .5rem; }
        p { color: #94a3b8; line-height: 1.5; }
        button { margin-top: 1rem; padding: .6rem 1.4rem; border: 0; border-radius: 999px; background: #22c55e; color: #0f172a; font-weight: 600; font-size: 1rem; cursor: pointer; }
    </style>
</head>
<body>
<main>
    <img src="/Aurea.png" alt="" width="64" height="64" style="border-radius: 12px;">
    <h1>Sin conexión</h1>
    <p>No hay conexión a internet. Por seguridad, GEME no guarda en este dispositivo las páginas con datos del negocio.</p>
    <p>Cuando vuelva la conexión, recarga la página.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
</main>
</body>
</html>
